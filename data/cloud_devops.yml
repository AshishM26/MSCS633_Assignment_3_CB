  - - "What is cloud?"
    - "Cloud computing provides on-demand access to shared computing resources, such as servers, storage, and applications, over a network. You can provision and release capacity as needed instead of owning all the hardware."
  - - "What is cloud computing?"
    - "Cloud computing provides on-demand access to shared computing resources, such as servers, storage, and applications, over a network. You can provision and release capacity as needed instead of owning all the hardware."
  - - "Explain cloud computing"
    - "Cloud computing provides on-demand access to shared computing resources, such as servers, storage, and applications, over a network. You can provision and release capacity as needed instead of owning all the hardware."
  - - "What is your name?"
    - "I am CloudOps Assistant, your Cloud and DevOps learning companion."
  - - "What should I say in standup?"
    - "Share your progress, your next step, and any blockers. Keep it brief and save detailed discussions for afterward."
  - - "What is a blocker?"
    - "A blocker is something preventing progress, such as missing access or an unresolved dependency. Tell the team what help you need."
  - - "Who should review a pull request?"
    - "Ask a teammate familiar with the affected code or the designated code owner. A reviewer should check correctness, readability, and tests."
  - - "What should we do after an incident?"
    - "Confirm recovery, communicate the outcome, and review what happened. Record follow-up actions that improve detection and prevention."
  - - "What is a blameless postmortem?"
    - "It is a review of an incident that focuses on contributing conditions and improvements instead of blaming individuals."
  - - "What happens during an on-call handoff?"
    - "Share active incidents, recent changes, known risks, and escalation contacts. Make sure the incoming responder has the access and context they need."
  - - "What should we check before deploying?"
    - "Check test results, configuration, dependencies, monitoring, and the rollback plan. Confirm the release is approved and the team knows about it."
  - - "What should we do if a deployment fails?"
    - "Pause the rollout, check logs and health signals, and follow the rollback plan if recovery requires it. Communicate the impact and investigate the cause."
  - - "What is DevOps?"
    - "DevOps combines development and operations practices to deliver software reliably. Collaboration, automation, and feedback help teams improve delivery."
  - - "What is CI?"
    - "Continuous integration means frequently merging small changes and running automated builds and tests to catch problems early."
  - - "What is CD?"
    - "CD can mean continuous delivery or continuous deployment. Delivery keeps releases ready for approval; deployment automatically releases changes that pass the required checks."
  - - "What is CI/CD?"
    - "CI/CD automates building, testing, and preparing or deploying software changes. It helps teams deliver small changes consistently."
  - - "What is Infrastructure as Code?"
    - "Infrastructure as Code defines infrastructure in version-controlled files. It makes changes reviewable and environments easier to reproduce."
  - - "What is Terraform?"
    - "Terraform is an Infrastructure as Code tool for defining and managing resources through providers. Review its plan before applying changes."
  - - "What is Docker?"
    - "Docker provides tools to build container images and run containers. It helps package an application with the dependencies it needs."
  - - "What is Kubernetes?"
    - "Kubernetes orchestrates containerized applications, managing scheduling, scaling, and recovery across a cluster."
  - - "What is a container?"
    - "A container is an isolated process with its application dependencies packaged together. Containers typically share the host operating system kernel."
  - - "What is autoscaling?"
    - "Autoscaling adjusts capacity based on demand or policies. Good limits and metrics help balance performance and cost."
  - - "What is a load balancer?"
    - "A load balancer distributes requests across multiple backends. Health checks help it avoid sending traffic to unhealthy instances."
  - - "What is high availability?"
    - "High availability reduces service interruptions through redundancy and failure recovery. It still requires planning and testing for failures."
  - - "What is IAM?"
    - "Identity and Access Management controls who can access resources and what actions they can perform."
  - - "What is least privilege?"
    - "Least privilege gives users and services only the permissions needed for their tasks. Review access regularly and remove permissions that are no longer needed."
  - - "What is a VPC?"
    - "A Virtual Private Cloud is a logically isolated network in a public cloud. You control settings such as subnets, routing, and network access."
  - - "What is observability?"
    - "Observability is the ability to understand a system from its outputs, such as logs, metrics, and traces. It helps investigate both expected and unexpected problems."
  - - "What is monitoring?"
    - "Monitoring collects and checks system signals against expected behavior. Dashboards and alerts help teams detect issues."
  - - "What is logging?"
    - "Logging records discrete events from an application or system. Useful logs include context while avoiding passwords and other sensitive data."
  - - "What are metrics?"
    - "Metrics are numerical measurements over time, such as request rate, error rate, and latency. They help reveal trends and trigger alerts."
  - - "What is tracing?"
    - "Tracing follows a request across components using linked spans. It helps identify where time is spent or a failure occurs."
  - - "What is an incident?"
    - "An incident is an unplanned event that disrupts or degrades a service. Teams coordinate response to restore normal operation."
  - - "What is rollback?"
    - "A rollback returns a system to a previous known-good version or configuration. Database and data changes may need a separate recovery strategy."
  - - "What is a blue-green deployment?"
    - "A blue-green deployment uses two environments and switches traffic to the new one after validation. Keep data compatibility and rollback requirements in mind."
  - - "What is a canary deployment?"
    - "A canary deployment sends a small share of traffic to a new version first. Expand the rollout only if its health signals remain acceptable."
  - - "What is configuration drift?"
    - "Configuration drift occurs when actual infrastructure differs from its intended configuration. Detect it through checks and reconcile changes through reviewed code."
  - - "What is immutable infrastructure?"
    - "Immutable infrastructure replaces components with newly built versions instead of modifying running ones. Persistent data needs its own storage and migration plan."
  - - "What is an environment variable?"
    - "An environment variable is a named value passed to a process to configure its behavior. Avoid treating it as a secure storage system for secrets."
  - - "What is a secret?"
    - "A secret is sensitive information such as a password, token, or private key. Store it securely, restrict access, and keep it out of code and logs."
  - - "What is RTO?"
    - "Recovery Time Objective is the target time for restoring a service after a disruption. It guides recovery planning and testing."
  - - "What is RPO?"
    - "Recovery Point Objective is the maximum targeted data-loss window, measured in time. It helps determine backup and replication requirements."
  - - "Why should production changes be tested?"
    - "Testing catches defects before users are affected and gives evidence that a change behaves as intended. It reduces risk but cannot guarantee a failure-free release."
  - - "Why are health checks useful?"
    - "Health checks help detect whether a service can handle traffic. They support routing and recovery decisions when designed to reflect meaningful service health."
  - - "Can you explain CI/CD?"
    - "CI/CD automates building, testing, and preparing or deploying software changes. It helps teams deliver small changes consistently."
